<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godwin's Daily Brain Test - Maths</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:780px;margin:auto;padding:14px;background:#f3f4f6;color:#111}
.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 5px;font-size:24px}
.small{font-size:13px;color:#555;line-height:1.35}
.bar{height:8px;background:#ddd;border-radius:20px;overflow:hidden;margin:14px 0}
.bar div{height:100%;background:#007aff}
button{width:100%;padding:14px;margin:7px 0;border:none;border-radius:12px;font-size:16px}
.opt{background:#ececec;color:#111;text-align:left;border:2px solid transparent}
.opt.sel{background:#ddecff;border-color:#007aff}
.back{background:#111;color:#fff;font-weight:700}
.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}
.nav button{padding:8px 0;margin:0;border-radius:8px;font-size:13px;background:#e5e7eb;color:#111}
.nav .done{background:#c8f7d0}
.nav .current{outline:2px solid #007aff}
.good{color:#128a2e}.bad{color:#c1121f}
.review p{background:#f6f6f6;border-radius:10px;padding:10px}
#splash{
 position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#0f172a,#020617);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 padding:24px;color:white;transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:210px;max-width:72vw;border-radius:24px;margin-bottom:22px}
#splash h1{font-size:28px;margin:0 0 8px;color:white}
#splash p{margin:4px 0;color:#cbd5e1}
.spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.22);border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;margin-top:22px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function randomizeOptions(q){
 const pairs=q[1].map((text,idx)=>({text,correct:idx===q[2]}));
 const mixed=shuffle(pairs);
 return [q[0], mixed.map(x=>x.text), mixed.findIndex(x=>x.correct)];
}
function best(){return localStorage.bestMathsScore || "-";}
function start(){qs=shuffle([...bank]).slice(0,20).map(randomizeOptions);i=0;answers=Array(20).fill(null);draw();}
function score(){return qs.reduce((t,q,n)=>t+(answers[n]===q[2]?1:0),0);}

function draw(){
 const q=qs[i];

 <div class="nav">${nav}</div>
 <h3>Question ${i+1}/20</h3>
 <p><b>${q[0]}</b></p>
 ${q[1].map((o,n)=>`<button class="opt ${answers[i]===n?'sel':''}" onclick="pick(${n})">${o}</button>`).join('')}
 <button class="back" onclick="back()" ${i===0?'style="opacity:.35"':''}>Back</button>`;
}

function pick(n){
 answers[i]=n;
 if(i===19) finish();
 else { i++; draw(); }
}
function back(){if(i>0){i--;draw();}}
function jump(n){i=n;draw();}

function finish(){
 const s=score();
 if(!localStorage.bestMathsScore || s>Number(localStorage.bestMathsScore)) localStorage.bestMathsScore=s;
 const wrong = qs.map((q,k)=>answers[k]===q[2]?null:
 `<p><b>${k+1}. ${q[0]}</b><br>Your answer: ${q[1][answers[k]]}<br><span class="good">Correct: ${q[1][q[2]]}</span></p>`).filter(Boolean).join('');
 document.getElementById('app').innerHTML=`
 <h2>Score: ${s}/20</h2>
 <h3 class="${s>=15?'good':'bad'}">${s>=15?'STRONG SCORE':'KEEP PRACTISING'}</h3>
 <p><b>Best Score:</b> ${best()}/20</p>
 <button class="back" onclick="i=19;draw()">Back to change last answer</button>
 <div class="review"><h3>Wrong answers</h3>${wrong || '<p>None. Excellent.</p>'}</div>`;
}
