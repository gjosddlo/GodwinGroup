<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Random 20 Driving Theory Test</title>
<style>
body{font-family:-apple-system,Arial,sans-serif;max-width:720px;margin:auto;padding:18px;background:#f4f4f4;color:#111}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
button{width:100%;padding:13px;margin:7px 0;border:none;border-radius:10px;font-size:16px}
.opt{background:#e9e9e9;color:#111;text-align:left}
.main{background:#007aff;color:#fff;font-weight:bold}
.ghost{background:#111;color:#fff}
.good{color:#128a2e}.bad{color:#c1121f}
.small{color:#555;font-size:13px}
</style></head>
<body><div class='card'><h1>UK Theory Practice</h1><p class='small'>20 random questions from a 100-question bank every time you load or restart.</p><div id='q'></div></div>
<script>
const bank = [["Safe gap in dry conditions?", ["1 sec", "2 sec", "4 sec", "10 sec"], 1], ["STOP sign shape?", ["Circle", "Triangle", "Octagon", "Square"], 2], ["Triangular signs mean?", ["Warning", "Order", "Parking", "Motorway"], 0], ["Right lane on motorway?", ["Cruising", "Overtaking", "Stopping", "Learners"], 1], ["Miss motorway exit?", ["Reverse", "Stop", "Next exit", "U-turn"], 2], ["Hard shoulder use?", ["Phone calls", "Overtaking", "Emergency", "Rest"], 2], ["Why give cyclists room?", ["They may wobble", "They have priority", "They cannot hear", "It is optional"], 0], ["Ball rolls into road?", ["Nothing", "A child may follow", "Road closed", "Cyclist turning"], 1], ["Amber light?", ["Speed up", "Stop if safe", "Always go", "Reverse"], 1], ["Red light means?", ["Stop", "Go", "Give way", "Slow only"], 0], ["Tailgating?", ["Towing", "Following too close", "Slow driving", "Lane changing"], 1], ["Minimum car tyre tread depth?", ["1.0mm", "1.6mm", "2.0mm", "3.0mm"], 1], ["Need before driving on public road?", ["Dashcam", "Valid insurance", "Breakdown cover", "Satnav"], 1], ["Secure a load?", ["No", "Motorway only", "Yes", "Trailer only"], 2], ["Roundabout priority?", ["Traffic from left", "Traffic from right", "Fastest vehicle", "Largest vehicle"], 1], ["What is a hazard?", ["Anything causing change", "Crash only", "Weather only", "People only"], 0], ["Vehicle skids?", ["Brake hard", "Steer gently", "Accelerate", "Close eyes"], 1], ["Emergency number?", ["111", "999/112", "101", "911"], 1], ["Dip headlights when?", ["Never", "Meeting traffic", "Motorway only", "Town only"], 1], ["After flood water?", ["Speed up", "Test brakes gently", "Wait one hour", "Turn lights off"], 1], ["Wet road stopping distance?", ["Same", "Double", "Half", "Only slightly more"], 1], ["Icy road stopping distance?", ["2x", "5x", "10x", "Same"], 2], ["Blue circular signs usually give?", ["Mandatory instruction", "Warning", "Parking info", "Diversion"], 0], ["Red bordered circular signs usually mean?", ["Warning", "Prohibition/order", "Info", "Tourist route"], 1], ["When joining a motorway?", ["Force in", "Match speed and find safe gap", "Stop at end", "Use hard shoulder"], 1], ["When passing horse riders?", ["Rev engine", "Pass wide and slowly", "Sound horn", "Drive close"], 1], ["Near a school expect?", ["Children may step out", "Clear roads", "No parked cars", "No crossings"], 0], ["At a zebra crossing with pedestrians waiting?", ["Speed up", "Prepare to slow/stop", "Horn", "Wave without checking"], 1], ["Another driver makes a mistake?", ["Flash aggressively", "Stay calm", "Tailgate", "Block them"], 1], ["Check tyres for?", ["Pressure, tread, condition", "Colour", "Brand only", "Age only"], 0], ["Head restraints reduce risk of?", ["Neck injury", "Fuel use", "Skids", "Punctures"], 0], ["MOT certificate proves?", ["Roadworthiness test pass", "Insurance", "Ownership", "Licence"], 0], ["V5C shows?", ["Registered keeper", "MOT result", "Insurance", "Tax paid"], 0], ["Heavy roof rack affects?", ["Handling and fuel use", "Braking improves", "Steering lighter", "Nothing"], 0], ["Driving through deep water avoid?", ["Slow steady speed", "Driving too fast", "Low gear", "Testing brakes later"], 1], ["Reduce speed before bend because?", ["Braking on bend reduces control", "Saves fuel only", "Engine quieter", "Lights brighter"], 0], ["Large vehicles turning need?", ["Extra room", "Less room", "No mirrors", "Priority always"], 0], ["Buses pulling away?", ["May move after signalling", "Cannot indicate", "Must wait always", "Not allowed"], 0], ["Crash scene first action?", ["Make scene safe", "Move everyone", "Take photos", "Drive away"], 0], ["Injured person in collision?", ["Call 999/112", "Call council", "Call insurer only", "Post online"], 0], ["Motorcyclist helmet after crash?", ["Leave unless needed for breathing", "Always remove", "Illegal to leave", "Police only"], 0], ["Reduce fuel consumption?", ["Smooth acceleration and planning", "Harsh acceleration", "Under-inflated tyres", "Low gears always"], 0], ["Stuck in traffic long time?", ["Rev engine", "Switch engine off when safe", "Use main beam", "Open boot"], 1], ["Casualty not breathing normally?", ["Start CPR and call 999/112", "Give drink", "Move to road", "Wait"], 0], ["AED does what?", ["Helps treat dangerous heart rhythms", "Checks tyres", "Measures alcohol", "Starts battery"], 0], ["Solid white line nearest you?", ["Do not cross except limited cases", "Overtake anytime", "Parking allowed", "One way"], 0], ["Yellow box junction?", ["Do not enter unless exit clear", "Parking free", "Bus stop", "Pedestrian zone"], 0], ["Dazzled by headlights?", ["Look left edge and slow if needed", "Look directly", "Flash continuously", "Stop in lane"], 0], ["Fog lights use?", ["When visibility seriously reduced", "Any rain", "Every night", "Every motorway"], 0], ["At a pelican crossing flashing amber?", ["Give way to pedestrians on crossing", "Always stop forever", "Speed up", "Ignore pedestrians"], 0], ["Double red lines mean?", ["No stopping at any time shown", "Free parking", "Bus lane only", "No overtaking"], 0], ["Box junction exception?", ["Turning right and blocked by oncoming traffic", "Going straight", "Parking", "Loading"], 0], ["When towing, mirrors must?", ["Give clear view behind", "Be folded", "Be removed", "Point down"], 0], ["Alcohol affects driving by?", ["Slowing reactions and judgment", "Improving confidence safely", "Reducing stopping distance", "Improving vision"], 0], ["Mobile phone while driving?", ["Illegal to hold/use except emergency situations", "Fine if slow", "Fine at lights", "Fine on speaker held"], 0], ["Learner drivers on motorway?", ["Allowed with approved instructor in dual-control car", "Never allowed", "Only at night", "Only with parent"], 0], ["Smart motorway red X means?", ["Lane closed", "Use lane", "Overtake", "Speed up"], 0], ["Variable speed limits?", ["Must be obeyed when displayed", "Advisory only", "Apply to lorries only", "Ignore at night"], 0], ["ABS helps you?", ["Steer while braking hard", "Stop instantly", "Drive faster", "Avoid mirrors"], 0], ["Seatbelt law?", ["Must wear unless exempt", "Optional in back", "Only motorway", "Only driver"], 0], ["Children in car need?", ["Correct child restraint for age/height", "Adult belt always", "No belt rear", "Front seat only"], 0], ["Engine warning light?", ["Get it checked", "Ignore", "Drive faster", "Remove fuse"], 0], ["Low tyre pressure causes?", ["Poor handling and higher wear", "Better grip", "Lower fuel use", "Sharper steering"], 0], ["Aquaplaning means?", ["Tyres ride on water and lose grip", "Engine stalls", "Brakes overheat", "Lights fail"], 0], ["If aquaplaning?", ["Ease off accelerator, don't brake harshly", "Brake hard", "Accelerate", "Steer sharply"], 0], ["Country lanes expect?", ["Sharp bends, walkers, animals", "Only cars", "No hazards", "Street lights"], 0], ["Tram lane?", ["Keep clear unless signs allow", "Always use it", "Park in it", "Overtake in it"], 0], ["Bus lane?", ["Use only when signs allow", "Always for cars", "Only at night", "Only if empty"], 0], ["When reversing?", ["Check all around and go slowly", "Use mirrors only", "Reverse fast", "Ignore blind spots"], 0], ["Before opening door roadside?", ["Check for cyclists/traffic", "Open quickly", "Ask passenger", "Sound horn"], 0], ["Flashing headlights mean?", ["Only 'I am here'", "Go ahead always", "Thanks always", "Police ahead"], 0], ["Horn use?", ["Warn others of your presence", "Show anger", "At night in built-up areas", "At parked cars"], 0], ["You feel tired?", ["Stop safely and rest", "Open window only", "Turn music up", "Drive faster"], 0], ["Medication warning?", ["Check if it affects driving", "Ignore prescribed meds", "Take extra", "Drive at night"], 0], ["Motorway breakdown?", ["Get left, exit vehicle safely, call help", "Stay in car always", "Repair in lane", "Walk along carriageway"], 0], ["Emergency vehicle behind?", ["Move safely when possible", "Panic brake", "Mount pavement", "Run red light"], 0], ["Level crossing red lights?", ["Stop", "Proceed if clear", "Only trains stop", "Overtake"], 0], ["Pedestrian refuge?", ["Give pedestrians time and space", "Speed through", "Overtake", "Park there"], 0], ["Cycle lane solid line?", ["Do not drive/park during operating times", "Use anytime", "Overtake there", "Bus only"], 0], ["Motorway lane discipline?", ["Keep left unless overtaking", "Middle lane cruise", "Right lane fastest", "Any lane"], 0], ["Speed limit with street lights usually?", ["30 mph unless signs say otherwise", "20 mph always", "40 mph always", "60 mph"], 0], ["National speed limit single carriageway car?", ["60 mph", "70 mph", "50 mph", "40 mph"], 0], ["National speed limit dual carriageway car?", ["70 mph", "60 mph", "50 mph", "80 mph"], 0], ["Urban clearway?", ["No stopping during times shown", "No driving", "Free parking", "No pedestrians"], 0], ["Green filter arrow?", ["Proceed in arrow direction if safe", "Ignore red always", "Stop", "Pedestrians only"], 0], ["Mini-roundabout?", ["Treat like normal roundabout", "Drive over always", "No priority", "Park in centre"], 0], ["Unmarked crossroads?", ["Slow and be prepared to give way", "Assume priority", "Speed up", "Horn"], 0], ["Dashboard oil warning?", ["Stop safely and investigate", "Keep driving", "Add water", "Rev engine"], 0], ["Brake warning light?", ["Stop safely and get help", "Ignore", "Drive faster", "Pump brakes only"], 0], ["Driving in strong side winds?", ["Keep speed down, firm grip", "Drive close to lorries", "Speed up", "Open windows"], 0], ["Overtaking before a bend?", ["Do not overtake", "Overtake quickly", "Use horn", "Follow centre line"], 0], ["Pedestrians with white stick/red bands?", ["Deaf and blind", "Tourist", "School patrol", "Cyclist"], 0], ["Animals on road?", ["Slow down and be ready to stop", "Sound horn always", "Speed up", "Swerve sharply"], 0], ["Emergency refuge area?", ["Use in emergency/breakdown", "Rest stop", "Phone calls", "Parking"], 0], ["When can you use hazard lights while moving?", ["To warn traffic of sudden obstruction ahead", "In rain always", "Parking only", "When lost"], 0], ["Parking at night on road over 30mph?", ["Use parking lights", "No lights needed", "Use fog lights", "Use hazards all night"], 0], ["One-way street signs?", ["Traffic flows one direction", "No entry", "No stopping", "Road closed"], 0], ["No entry sign?", ["Do not enter", "Give way", "Stop only", "Motorway"], 0], ["Give Way sign shape?", ["Inverted triangle", "Circle", "Octagon", "Square"], 0], ["STOP line at junction?", ["Stop fully before line", "Roll through", "Stop after line", "Ignore if clear"], 0], ["When should mirrors be checked?", ["Before signalling, changing speed/direction", "Only reversing", "Once per journey", "Only motorway"], 0]];
let qs=[], i=0, s=0, wrong=[];
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function start(){qs=shuffle([...bank]).slice(0,20);i=0;s=0;wrong=[];draw();}
function draw(){
 if(i>=qs.length){
   document.getElementById('q').innerHTML=`<h2>Score: ${s}/20</h2><h3 class="${s>=17?'good':'bad'}">${s>=17?'PASS':'KEEP PRACTISING'}</h3>
   <button class='main' onclick='start()'>New Random Test</button>
   <h3>Wrong answers</h3>${wrong.length?wrong.map(w=>`<p><b>${w.q}</b><br>Your answer: ${w.y}<br><span class='good'>Correct: ${w.c}</span></p>`).join(''):'<p>None. Strong.</p>'}`;
   return;
 }
 let q=qs[i];
 document.getElementById('q').innerHTML=`<h3>Question ${i+1}/20</h3><p><b>${q[0]}</b></p>`+
 q[1].map((o,n)=>`<button class='opt' onclick='ans(${n})'>${o}</button>`).join('');
}
function ans(n){let q=qs[i];if(n===q[2])s++;else wrong.push({q:q[0],y:q[1][n],c:q[1][q[2]]});i++;draw();}
start();
</script></body></html>
