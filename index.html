<style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f3f4f6;color:#111}

.signgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}

<script>
const bank=[{"q": "Which sign means no motor vehicles are allowed?", "o": ["No waiting", "No motor vehicles", "National speed limit applies", "No overtaking"], "a": 1, "img": "signs4_no_motor"}, {"q": "What does this sign mean?", "o": ["No waiting", "No stopping", "No entry", "Clearway"], "a": 0, "img": "no_waiting"}, {"q": "What does this sign mean?", "o": ["No motor vehicles", "No overtaking", "No parking", "Two-way traffic"], "a": 1, "img": "no_overtaking"}, {"q": "What does this sign mean?", "o": ["National speed limit applies", "No overtaking", "End of motorway", "No vehicles"], "a": 0, "img": "national_speed"}, {"q": "What shape is a STOP sign?", "o": ["Circle", "Triangle", "Octagon", "Square"], "a": 2}, {"q": "Triangular signs usually mean?", "o": ["Warning", "Order", "Parking", "Motorway"], "a": 0}, {"q": "Circular signs with red borders usually mean?", "o": ["Warning", "Order or prohibition", "Information", "Diversion"], "a": 1}, {"q": "Blue circular signs usually give?", "o": ["Mandatory instruction", "Warning", "Parking info", "Tourist route"], "a": 0}, {"q": "Safe gap in dry conditions?", "o": ["1 second", "2 seconds", "4 seconds", "10 seconds"], "a": 1}, {"q": "Wet road stopping distance?", "o": ["Same", "Double", "Half", "Only slightly more"], "a": 1}, {"q": "Icy road stopping distance can be?", "o": ["2x normal", "5x normal", "10x normal", "Same"], "a": 2}, {"q": "Right lane on motorway is normally for?", "o": ["Cruising", "Overtaking", "Stopping", "Learners"], "a": 1}, {"q": "Miss motorway exit?", "o": ["Reverse", "Stop", "Continue to next exit", "U-turn"], "a": 2}, {"q": "Hard shoulder use?", "o": ["Phone calls", "Overtaking", "Emergency", "Rest"], "a": 2}, {"q": "Joining a motorway?", "o": ["Force in", "Match speed and find safe gap", "Stop at end", "Use hard shoulder"], "a": 1}, {"q": "Red X above motorway lane means?", "o": ["Lane closed", "Use lane", "Overtake", "Speed up"], "a": 0}, {"q": "Variable speed limits on motorway?", "o": ["Must be obeyed when displayed", "Advisory only", "Lorries only", "Ignore at night"], "a": 0}, {"q": "Motorway lane discipline?", "o": ["Keep left unless overtaking", "Middle lane cruise", "Right lane fastest", "Any lane"], "a": 0}, {"q": "Why give cyclists room?", "o": ["They may wobble", "They have priority always", "They cannot hear", "It is optional"], "a": 0}, {"q": "Ball rolls into road?", "o": ["Nothing", "A child may follow", "Road closed", "Cyclist turning"], "a": 1}, {"q": "Near a school expect?", "o": ["Children may step out", "Clear roads", "No parked cars", "No crossings"], "a": 0}, {"q": "When passing horse riders?", "o": ["Rev engine", "Pass wide and slowly", "Sound horn", "Drive close"], "a": 1}, {"q": "At amber light?", "o": ["Speed up", "Stop if safe", "Always go", "Reverse"], "a": 1}, {"q": "Red light means?", "o": ["Stop", "Go", "Give way", "Slow only"], "a": 0}, {"q": "Roundabout priority?", "o": ["Traffic from left", "Traffic from right", "Fastest vehicle", "Largest vehicle"], "a": 1}, {"q": "At a zebra crossing with pedestrians waiting?", "o": ["Speed up", "Prepare to slow/stop", "Horn", "Wave without checking"], "a": 1}, {"q": "Flashing headlights mean?", "o": ["Only 'I am here'", "Go ahead always", "Thanks always", "Police ahead"], "a": 0}, {"q": "Horn use?", "o": ["Warn others of your presence", "Show anger", "At night in built-up areas", "At parked cars"], "a": 0}, {"q": "Tailgating?", "o": ["Towing", "Following too close", "Slow driving", "Lane changing"], "a": 1}, {"q": "Another driver makes a mistake?", "o": ["Flash aggressively", "Stay calm and give room", "Tailgate", "Block them"], "a": 1}, {"q": "Minimum car tyre tread depth?", "o": ["1.0mm", "1.6mm", "2.0mm", "3.0mm"], "a": 1}, {"q": "Check tyres for?", "o": ["Pressure, tread, condition", "Colour", "Brand only", "Age only"], "a": 0}, {"q": "Low tyre pressure causes?", "o": ["Poor handling and higher wear", "Better grip", "Lower fuel use", "Sharper steering"], "a": 0}, {"q": "Need before driving alty not breathing normally?", "o": ["Start CPR and call 999/112", "Give drink", "Move to road", "Wait"], "a": 0}, {"q": "AED does what?", "o": ["Helps treat dangerous heart rhythms", "Checks tyres", "Measures alcohol", "Starts battery"], "a": 0}, {"q": "Reduce fuel consumption?", "o": ["Smooth acceleration and planning", "Harsh acceleration", "Under-inflated tyres", "Low gears always"], "a": 0}, {"q": "Stuck in traffic long time?", "o": ["Rev engine", "Switch engine off when safe", "Use main beam", "Open boot"], "a": 1}, {"q": "Dip headlights when?", "o": ["Never", "Meeting traffic or following closely", "Motorway only", "Town only"], "a": 1}, {"q": "Dazzled by headlights?", "o": ["Look left edge and slow if needed", "Look directly", "Flash continuously", "Stop in lane"], "a": 0}, {"q": "Fog lights use?", "o": ["When visibility seriously reduced", "Any rain", "Every night", "Every motorway"], "a": 0}, {"q": "Solid white line nearest you?", "o": ["Do not cross except limited cases", "Overtake anytime", "Parking allowed", "One way"], "a": 0}, {"q": "Yellow box junction?", "o": ["Do not enter unless exit clear", "Parking free", "Bus stop", "Pedestrian zone"], "a": 0}, {"q": "Box junction exception?", "o": ["Turning right and blocked by oncoming traffic", "Going straight", "Parking", "Loading"], "a": 0}, {"q": "At pelican crossing flashing amber?", "o": ["Give way to pedestrians on crossing", "Always stop forever", "Speed up", "Ignore pedestrians"], "a": 0}, {"q": "Double red lines mean?", "o": ["No stopping at times shown", "Free parking", "Bus lane only", "No overtaking"], "a": 0}, {"q": "Cycle lane solid line?", "o": ["Do not drive/park during operating times", "Use anytime", "Overtake there", "Bus only"], "a": 0}, {"q": "Bus lane?", "o": ["Use only when signs allow", "Always for cars", "Only at night", "Only if empty"], "a": 0}, {"q": "Urban clearway?", "o": ["No stopping during times shown", "No driving", "Free parking", "No pedestrians"], "a": 0}, {"q": "Green filter arrow?", "o": ["Proceed in arrow direction if safe", "Ignore red always", "Stop", "Pedestrians only"], "a": 0}, {"q": "Mini-roundabout?", "o": ["Treat like normal roundabout", "Drive over always", "No priority", "Park in centre"], "a": 0}, {"q": "Unmarked crossroads?", "o": ["Slow and be prepared to give way", "Assume priority", "Speed up", "Horn"], "a": 0}, {"q": "Speed limit with street lights usually?", "o": ["30 mph unless signs say otherwise", "20 mph always", "40 mph always", "60 mph"], "a": 0}, {"q": "National speed limit single carriageway car?", "o": ["60 mph", "70 mph", "50 mph", "40 mph"], "a": 0}, {"q": "National speed limit dual carriageway car?", "o": ["70 mph", "60 mph", "50 mph", "80 mph"], "a": 0}, {"q": "Alcohol affects driving by?", "o": ["Slowing reactions and judgment", "Improving confidence safely", "Reducing stopping distance", "Improving vision"], "a": 0}, {"q": "Mobile phone while driving?", "o": ["Illegal to hold/use except emergency situations", "Fine if slow", "Fine at lights", "Fine on speaker held"], "a": 0}, {"q": "Learner drivers on motorway?", "o": ["Allowed with approved instructor in dual-control car", "Never allowed", "Only at night", "Only with parent"], "a": 0}, {"q": "ABS helps you?", "o": ["Steer while braking hard", "Stop instantly", "Drive faster", "Avoid mirrors"], "a": 0}, {"q": "Seatbelt law?", "o": ["Must wear unless exempt", "Optional in back", "Only motorway", "Only driver"], "a": 0}, {"q": "Children in car need?", "o": ["Correct restraint for age/height", "Adult belt always", "No belt rear", "Front seat only"], "a": 0}, {"q": "Engine warning light?", "o": ["Get it checked", "Ignore", "Drive faster", "Remove fuse"], "a": 0}, {"q": "Dashboard oil warning?", "o": ["Stop safely and investigate", "Keep driving", "Add water", "Rev engine"], "a": 0}, {"q": "Brake warning light?", "o": ["Stop safely and get help", "Ignore", "Drive faster", "Pump brakes only"], "a": 0}, {"q": "Driving in strong side winds?", "o": ["Keep speed down, firm grip", "Drive close to lorries", "Speed up", "Open windows"], "a": 0}, {"q": "Overtaking before a bend?", "o": ["Do not overtake", "Overtake quickly", "Use horn", "Follow centre line"], "a": 0}, {"q": "Pedestrians with white stick/red bands?", "o": ["Deaf and blind", "Tourist", "School patrol", "Cyclist"], "a": 0}, {"q": "Animals on road?", "o": ["Slow down and be ready to stop", "Sound horn always", "Speed up", "Swerve sharply"], "a": 0}, {"q": "Emergency refuge area?", "o": ["Use in emergency/breakdown", "Rest stop", "Phone calls", "Parking"], "a": 0}, {"q": "Hazard lights while moving?", "o": ["Warn traffic of sudden obstruction ahead", "In rain always", "Parking only", "When lost"], "a": 0}, {"q": "Parking at night on road over 30mph?", "o": ["Use parking lights", "No lights needed", "Use fog lights", "Use hazards all night"], "a": 0}, {"q": "One-way street signs?", "o": ["Traffic flows one direction", "No entry", "No stopping", "Road closed"], "a": 0}, {"q": "No entry sign?", "o": ["Do not enter", "Give way", "Stop only", "Motorway"], "a": 0}, {"q": "Give Way sign shape?", "o": ["Inverted triangle", "Circle", "Octagon", "Square"], "a": 0}, {"q": "STOP line at junction?", "o": ["Stop fully before line", "Roll through", "Stop after line", "Ignore if clear"], "a": 0}, {"q": "When should mirrors be checked?", "o": ["Before signalling, changing speed/direction", "Only reversing", "Once per journey", "Only motorway"], "a": 0}, {"q": "Before opening roadside door?", "o": ["Check for cyclists/traffic", "Open quickly", "Ask passenger", "Sound horn"], "a": 0}, {"q": "You feel tired?", "o": ["Stop safely and rest", "Open window only", "Turn music up", "Drive faster"], "a": 0}, {"q": "Medication warning?", "o": ["Check if it affects driving", "Ignore prescribed meds", "Take extra", "Drive at night"], "a": 0}, {"q": "Motorway breakdown?", "o": ["Get left, exit vehicle safely, call help", "Stay in car always", "Repair in lane", "Walk along carriageway"], "a": 0}, {"q": "Emergency vehicle behind?", "o": ["Move safely when possible", "Panic brake", "Mount pavement", "Run red light"], "a": 0}, {"q": "Level crossing red lights?", "o": ["Stop", "Proceed if clear", "Only trains stop", "Overtake"], "a": 0}];

const SVG={
no_waiting:`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="#1479c9" stroke="#ef3b22" stroke-width="12"/><line x1="28" y1="28" x2="92" y2="92" stroke="#ef3b22" stroke-width="12"/><line x1="92" y1="28" x2="28" y2="92" stroke="#ef3b22" stroke-width="12"/></svg>`,
national_speed:`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="white" stroke="#999" stroke-width="2"/><rect x="5" y="50" width="110" height="20" transform="rotate(-45 60 60)" fill="#111"/></svg>`,
no_overtaking:`<svg viewBox="0 0 140 120"><circle cx="70" cy="60" r="50" fill="white" stroke="#ef3b22" stroke-width="9"/><rect x="38" y="55" width="28" height="18" rx="3" fill="#111"/><rect x="35" y="70" width="34" height="7" fill="#111"/><circle cx="43" cy="80" r="5" fill="#111"/><circle cx="62" cy="80" r="5" fill="#111"/><rect x="75" y="49" width="28" height="24" rx="3" fill="#ef3b22"/><rect x="72" y="70" width="34" height="7" fill="#ef3b22"/><circle cx="80" cy="80" r="5" fill="#ef3b22"/><circle cx="99" cy="80" r="5" fill="#ef3b22"/></svg>`,
no_motor:`<svg viewBox="0 0 140 120"><circle cx="70" cy="60" r="50" fill="white" stroke="#ef3b22" stroke-width="9"/><rect x="45" y="58" width="48" height="20" rx="4" fill="#111"/><rect x="51" y="45" width="36" height="20" rx="5" fill="none" stroke="#111" stroke-width="5"/><circle cx="54" cy="82" r="6" fill="#111"/><circle cx="86" cy="82" r="6" fill="#111"/><circle cx="67" cy="26" r="8" fill="none" stroke="#111" stroke-width="4"/><circle cx="93" cy="26" r="8" fill="none" stroke="#111" stroke-width="4"/><path d="M67 26 L78 14 L85 26 L93 26 M78 14 L70 14" fill="none" stroke="#111" stroke-width="4"/></svg>`,
signs4_no_motor:`<div class="signgrid"><div>${SVG.no_waiting}</div><div>${SVG.no_motor}</div><div>${SVG.national_speed}</div><div>${SVG.no_overtaking}</div></div>`
};

let qs=[], i=0, answers=[], wrong=[];
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function start(){qs=shuffle([...bank]).slice(0,20);i=0;answers=Array(20).fill(null);wrong=[];draw();}
function score(){return qs.reduce((t,q,idx)=>t+(answers[idx]===q.a?1:0),0);}
function imageHTML(q){return q.img ? `<div class="signbox">${SVG[q.img]}</div>` : '';}
function draw(){
 if(i>=qs.length){finish();return;}
 let q=qs[i];
 document.getElementById('q').innerHTML=`<h3>Question ${i+1}/20</h3><p><b>${q.q}</b></p>${imageHTML(q)}`+
 q.o.map((o,n)=>`<button class="opt ${answers[i]===n?'sel':''}" onclick="pick(${n})">${o}</button>`).join('')+
 `<button class="main" onclick="next()">${i===19?'Finish':'Next'}</button>
  <button class="back" onclick="back()" ${i===0?'style="opacity:.35"':''}>Back</button>
  <button class="ghost" onclick="start()">New Random Test</button>`;
}
function pick(n){answers[i]=n;draw();}
function next(){if(answers[i]===null){alert('Pick an answer first.');return;} i++; draw();}
function back(){if(i>0){i--;draw();}}
function finish(){
 let s=score();
 wrong=qs.map((q,idx)=>answers[idx]===q.a?null:{q:q.q,y:q.o[answers[idx]],c:q.o[q.a]}).filter(Boolean);
 document.getElementById('q').innerHTML=`<h2>Score: ${s}/20</h2><h3 class="${s>=17?'good':'bad'}">${s>=17?'PASS':'KEEP PRACTISING'}</h3>
 <button class="main" onclick="start()">New Random Test</button>
 <button class="back" onclick="i=19;draw()">Back to change last answer</button>
 <h3>Wrong answers</h3>${wrong.length?wrong.map(w=>`<p><b>${w.q}</b><br>Your answer: ${w.y}<br><span class="good">Correct: ${w.c}</span></p>`).join(''):'<p>None. Strong.</p>'}`;
}
start();
</script>
