<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>UK Driving Theory Practice</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --card2: #1f2937;
      --text: #f9fafb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 18px;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    .hero {
      background: rgba(17,24,39,0.92);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 {
      font-size: 27px;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }
    p { color: var(--muted); line-height: 1.45; margin: 8px 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .stat {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #03111f;
      background: var(--accent);
      margin-top: 12px;
      touch-action: manipulation;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger { background: var(--warn); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(2,6,23,0.92);
      backdrop-filter: blur(14px);
      padding: 10px 0;
      margin-bottom: 12px;
    }
    .progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .progress {
      height: 9px;
      background: #334155;
      border-radius: 20px;
      overflow: hidden;
    }
    .progress div {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .question-card {
      background: rgba(17,24,39,0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-top: 12px;
    }
    .category {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
    .q {
      font-size: 22px;
      line-height: 1.25;
      margin: 0 0 16px;
      letter-spacing: -0.2px;
    }
    .option {
      display: block;
      width: 100%;
      text-align: left;
      margin: 10px 0;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-weight: 600;
    }
    .option.selected {
      border-color: var(--accent);
      outline: 2px solid rgba(56,189,248,0.25);
    }
    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .hidden { display: none; }
    .result {
      background: rgba(17,24,39,0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin-top: 16px;
    }
    .pass { color: var(--good); font-size: 30px; font-weight: 900; }
    .fail { color: var(--bad); font-size: 30px; font-weight: 900; }
    .review-item {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin: 12px 0;
    }
    .small { font-size: 13px; color: var(--muted); }
    .correct { color: var(--good); font-weight: 800; }
    .wrong { color: var(--bad); font-weight: 800; }
    @media (max-width: 420px) {
      body { padding: 12px; }
      h1 { font-size: 24px; }
      .q { font-size: 20px; }
      .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      .stat { padding: 10px 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="start" class="hero">
      <h1>UK Driving Theory Practice</h1>
      <p>50 multiple-choice questions. 57-minute timer. Pass mark: 43/50.</p>
      <p class="small">Practice tool only — not an official DVSA product.</p>
      <div class="stats">
        <div class="stat"><strong>50</strong><span>Questions</span></div>
        <div class="stat"><strong>57</strong><span>Minutes</span></div>
        <div class="stat"><strong>43</strong><span>To pass</span></div>
      </div>
      <button onclick="startQuiz()">Start Test</button>
      <button class="secondary" onclick="startQuiz(true)">Quick Practice: Shuffle</button>
    </section>

    <section id="quiz" class="hidden">
      <div class="topbar">
        <div class="progress-wrap">
          <div class="row">
            <span id="count">Question 1 of 50</span>
            <span id="timer">57:00</span>
          </div>
          <div class="progress"><div id="bar"></div></div>
        </div>
      </div>

      <div class="question-card">
        <div id="category" class="category"></div>
        <h2 id="question" class="q"></h2>
        <div id="options"></div>
        <div class="nav">
          <button class="secondary" onclick="prevQ()">Back</button>
          <button onclick="nextQ()" id="nextBtn">Next</button>
        </div>
        <button class="danger" onclick="finishQuiz()">Finish Test</button>
      </div>
    </section>

    <section id="result" class="hidden result"></section>
  </div>

  <script>
    const PASS_MARK = 43;
    const TIME_LIMIT = 57 * 60;
    let timeLeft = TIME_LIMIT;
    let timerId = null;
    let current = 0;
    let userAnswers = [];
    let questions = [];

    const bank = [
      {cat:"Alertness", q:"What should you do before moving off from the side of the road?", a:["Signal only and move off quickly","Use all mirrors, check blind spots, signal if needed, then move off safely","Sound your horn and pull out","Only check the interior mirror"], c:1},
      {cat:"Safety Margins", q:"What is the typical minimum gap you should leave from the vehicle in front in good dry conditions?", a:["One second","Two seconds","Four seconds","Ten metres"], c:1},
      {cat:"Safety Margins", q:"What should happen to your stopping distance on a wet road?", a:["It stays the same","It doubles","It halves","It only changes on motorways"], c:1},
      {cat:"Safety Margins", q:"On icy roads, stopping distances can be how much greater than normal?", a:["Two times","Five times","Ten times","Twenty times"], c:2},
      {cat:"Road Signs", q:"What shape is a UK STOP sign?", a:["Circle","Triangle","Octagon","Rectangle"], c:2},
      {cat:"Road Signs", q:"What do triangular road signs usually mean?", a:["Warnings","Orders","Information","Parking restrictions"], c:0},
      {cat:"Road Signs", q:"What do circular signs with a red border usually mean?", a:["A warning","An instruction or prohibition","A motorway service area","A diversion"], c:1},
      {cat:"Road Signs", q:"What does a blue circular sign usually give?", a:["A mandatory instruction","A warning","A parking charge","A tourist route"], c:0},
      {cat:"Motorways", q:"What is the right-hand lane of a motorway normally used for?", a:["Normal cruising","Overtaking","Slow vehicles","Emergency vehicles only"], c:1},
      {cat:"Motorways", q:"What should you do if you miss your motorway exit?", a:["Reverse on the hard shoulder","Stop and wait","Continue to the next exit","Make a U-turn at the next gap"], c:2},
      {cat:"Motorways", q:"When joining a motorway from a slip road, what should you do?", a:["Force your way in","Match your speed to traffic and find a safe gap","Stop at the end of the slip road","Use the hard shoulder"], c:1},
      {cat:"Motorways", q:"What should you use the hard shoulder for?", a:["Overtaking slow traffic","Stopping in an emergency","Taking phone calls","Resting when tired"], c:1},
      {cat:"Vulnerable Road Users", q:"Why should you give cyclists extra room when overtaking?", a:["They may wobble or need to avoid drains and potholes","They always have priority","They cannot hear cars","They must ride in the gutter"], c:0},
      {cat:"Vulnerable Road Users", q:"Near a school, what should you expect?", a:["Children may step into the road unexpectedly","Traffic will always be slow","You can ignore parked cars","Pedestrians will only use crossings"], c:0},
      {cat:"Vulnerable Road Users", q:"What should you do when passing horse riders?", a:["Rev your engine","Pass wide and slowly","Sound your horn","Drive very close so they can see you"], c:1},
      {cat:"Hazard Awareness", q:"What is a hazard?", a:["Anything that could cause you to change speed or direction","Only a broken-down vehicle","Only bad weather","Only a pedestrian crossing"], c:0},
      {cat:"Hazard Awareness", q:"You see a ball bounce into the road. What should you expect?", a:["A child may follow it","Nothing else will happen","The road is closed","A cyclist is turning"], c:0},
      {cat:"Hazard Awareness", q:"Why should you slow down near parked cars?", a:["Engines may be cold","Doors may open or pedestrians may step out","Parked cars have priority","You must always stop"], c:1},
      {cat:"Rules of the Road", q:"At a zebra crossing with pedestrians waiting to cross, what should you do?", a:["Speed up","Be prepared to slow down and stop","Sound your horn","Wave them across without checking"], c:1},
      {cat:"Rules of the Road", q:"At a roundabout, who normally has priority?", a:["Traffic joining from the left","Traffic already on the roundabout from your right","The fastest vehicle","Large vehicles only"], c:1},
      {cat:"Rules of the Road", q:"What should you do at an amber traffic light?", a:["Speed up to beat red","Stop if safe to do so","Always continue","Reverse behind the line"], c:1},
      {cat:"Rules of the Road", q:"What does a red traffic light mean?", a:["Stop behind the stop line","Proceed if clear","Give way only","Stop only if pedestrians are present"], c:0},
      {cat:"Attitude", q:"Another driver makes a mistake. What should you do?", a:["Flash headlights aggressively","Stay calm and give them room","Drive close behind them","Sound your horn continuously"], c:1},
      {cat:"Attitude", q:"What is tailgating?", a:["Driving too close to the vehicle in front","Driving with a trailer","Following a diversion","Driving slowly in fog"], c:0},
      {cat:"Attitude", q:"How should you deal with an aggressive driver behind you?", a:["Brake sharply","Stay calm and allow them to pass when safe","Race them","Block them"], c:1},
      {cat:"Safety and Your Vehicle", q:"What should you check regularly to reduce the risk of tyre failure?", a:["Tyre pressure, tread depth and condition","Seat fabric","Radio volume","Number plate font"], c:0},
      {cat:"Safety and Your Vehicle", q:"What is the legal minimum tyre tread depth for cars in the UK?", a:["1.0 mm","1.6 mm","2.5 mm","3.0 mm"], c:1},
      {cat:"Safety and Your Vehicle", q:"Why should head restraints be adjusted correctly?", a:["To improve fuel economy","To reduce the risk of neck injury","To make reversing easier","To stop the seatbelt locking"], c:1},
      {cat:"Documents", q:"What document proves your vehicle has passed its annual roadworthiness test?", a:["MOT certificate","V5C log book","Insurance certificate","Driving licence"], c:0},
      {cat:"Documents", q:"What must you have before driving on a public road?", a:["Breakdown cover","Valid insurance","A full tank of fuel","A dashcam"], c:1},
      {cat:"Documents", q:"What does the V5C show?", a:["The registered keeper details","The MOT pass mark","Your insurance no-claims bonus","Your driving test result"], c:0},
      {cat:"Vehicle Loading", q:"How can a heavy roof rack affect your car?", a:["It lowers the centre of gravity","It can affect handling and fuel use","It improves braking","It makes steering lighter"], c:1},
      {cat:"Vehicle Loading", q:"What must you do with a load carried on your vehicle?", a:["Make sure it is secure","Cover the number plate","Place it as high as possible","Leave it loose for easy unloading"], c:0},
      {cat:"Vehicle Handling", q:"What should you avoid while driving through deep water?", a:["Using a low gear","Driving too fast","Keeping steady revs","Testing brakes afterwards"], c:1},
      {cat:"Vehicle Handling", q:"If your vehicle starts to skid, what should you do?", a:["Brake hard immediately","Steer gently into the skid and avoid harsh braking","Accelerate hard","Close your eyes briefly"], c:1},
      {cat:"Vehicle Handling", q:"Why should you reduce speed before a bend?", a:["Braking on a bend can reduce control","It saves the indicators","It makes the engine quieter","It improves the radio signal"], c:0},
      {cat:"Other Vehicles", q:"Why give large vehicles extra room when they turn?", a:["They may need to swing out wide","They always stop quickly","They never use mirrors","They have priority at all times"], c:0},
      {cat:"Other Vehicles", q:"What should you remember about buses pulling away from stops?", a:["They may move off after signalling","They cannot indicate","They must always wait for you","They are not allowed in traffic"], c:0},
      {cat:"Accidents", q:"At the scene of a crash, what should you do first?", a:["Make sure you and others are safe","Move injured people immediately","Take photos only","Drive away if not involved"], c:0},
      {cat:"Accidents", q:"If someone is injured in a collision, who should you call?", a:["999 or 112","Your insurer only","The local council","A driving instructor"], c:0},
      {cat:"Accidents", q:"Why should you not remove a motorcyclist’s helmet after a crash?", a:["It may worsen injuries unless necessary for breathing","It is illegal in all cases","It protects against rain","It belongs to the police"], c:0},
      {cat:"Environmental", q:"How can you reduce fuel consumption?", a:["Accelerate harshly","Use smooth acceleration and plan ahead","Drive in lower gears constantly","Keep tyres under-inflated"], c:1},
      {cat:"Environmental", q:"When stuck in traffic for a long time, what can reduce emissions?", a:["Revving the engine","Switching off the engine when safe and appropriate","Using main beam","Opening windows"], c:1},
      {cat:"First Aid", q:"A casualty is not breathing normally. What should you do?", a:["Start CPR and call 999/112","Give them a drink","Move them into the road","Wait for them to wake up"], c:0},
      {cat:"First Aid", q:"What does an AED do?", a:["Helps treat certain life-threatening heart rhythms","Checks tyre pressure","Measures alcohol levels","Starts a car battery"], c:0},
      {cat:"Road Markings", q:"What do double white lines with a solid line nearest you mean?", a:["You must not cross or straddle except in limited legal situations","You can overtake anytime","Parking is allowed","The road is one-way"], c:0},
      {cat:"Road Markings", q:"What do yellow box junction markings mean?", a:["Do not enter unless your exit is clear, except when turning right and blocked by oncoming traffic","Parking is free","Pedestrians only","Bus stop ahead"], c:0},
      {cat:"Night Driving", q:"When should you dip your headlights?", a:["When meeting oncoming traffic or following another vehicle closely","Only in towns","Only on motorways","Never"], c:0},
      {cat:"Night Driving", q:"What should you do if dazzled by oncoming headlights?", a:["Look towards the left edge of your lane and slow if needed","Flash your lights continuously","Look directly at the lights","Stop in the middle of the road"], c:0},
      {cat:"Weather", q:"In fog, when should you use fog lights?", a:["When visibility is seriously reduced","Whenever it is raining","At night only","On every motorway"], c:0},
      {cat:"Weather", q:"After driving through flood water, what should you do?", a:["Drive fast to dry the engine","Test your brakes gently when safe","Switch off headlights","Stop for one hour"], c:1}
    ];

    function shuffle(arr) {
      return arr.map(v => [Math.random(), v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
    }

    function startQuiz(doShuffle=false) {
      questions = doShuffle ? shuffle([...bank]).slice(0,50) : [...bank].slice(0,50);
      userAnswers = new Array(questions.length).fill(null);
      current = 0;
      timeLeft = TIME_LIMIT;
      document.getElementById('start').classList.add('hidden');
      document.getElementById('result').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      if (timerId) clearInterval(timerId);
      timerId = setInterval(tick, 1000);
      renderQ();
    }

    function tick() {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 0) finishQuiz();
    }

    function updateTimer() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timer').textContent = `${m}:${String(s).padStart(2,'0')}`;
    }

    function renderQ() {
      const item = questions[current];
      document.getElementById('count').textContent = `Question ${current + 1} of ${questions.length}`;
      document.getElementById('bar').style.width = `${((current + 1) / questions.length) * 100}%`;
      document.getElementById('category').textContent = item.cat;
      document.getElementById('question').textContent = item.q;
      const opts = document.getElementById('options');
      opts.innerHTML = '';
      item.a.forEach((text, idx) => {
        const b = document.createElement('button');
        b.className = 'option' + (userAnswers[current] === idx ? ' selected' : '');
        b.textContent = text;
        b.onclick = () => {
          userAnswers[current] = idx;
          renderQ();
        };
        opts.appendChild(b);
      });
      document.getElementById('nextBtn').textContent = current === questions.length - 1 ? 'Finish' : 'Next';
      updateTimer();
    }

    function nextQ() {
      if (current === questions.length - 1) {
        finishQuiz();
      } else {
        current++;
        renderQ();
        window.scrollTo({top:0, behavior:'smooth'});
      }
    }

    function prevQ() {
      if (current > 0) {
        current--;
        renderQ();
        window.scrollTo({top:0, behavior:'smooth'});
      }
    }

    function finishQuiz() {
      if (timerId) clearInterval(timerId);
      const score = questions.reduce((sum, q, i) => sum + (userAnswers[i] === q.c ? 1 : 0), 0);
      const unanswered = userAnswers.filter(x => x === null).length;
      const passed = score >= PASS_MARK;
      document.getElementById('quiz').classList.add('hidden');
      const result = document.getElementById('result');
      result.classList.remove('hidden');

      let html = `
        <div class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'NOT YET'}</div>
        <h1>${score}/50</h1>
        <p>Pass mark is 43/50. ${unanswered ? `You left ${unanswered} unanswered.` : 'All questions answered.'}</p>
        <button onclick="startQuiz(true)">Retake Shuffled Test</button>
        <button class="secondary" onclick="location.reload()">Back to Start</button>
        <h2>Review</h2>
      `;

      questions.forEach((q, i) => {
        const ua = userAnswers[i];
        if (ua !== q.c) {
          html += `
            <div class="review-item">
              <div class="small">${i + 1}. ${q.cat}</div>
              <p><strong>${q.q}</strong></p>
              <p class="wrong">Your answer: ${ua === null ? 'Not answered' : q.a[ua]}</p>
              <p class="correct">Correct answer: ${q.a[q.c]}</p>
            </div>
          `;
        }
      });

      if (score === 50) html += `<p class="correct">Perfect score. Absolute machine.</p>`;
      result.innerHTML = html;
      window.scrollTo({top:0, behavior:'smooth'});
    }
  </script>
</body>
</html>
